<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: Inter, Arial, Helvetica, sans-serif; }
</style>
<rect width="1440" height="900" fill="#FFFFFF"/>
<rect x="0" y="0" width="260" height="900" fill="#F5F5F5" stroke="#CCCCCC"/>
<!-- Logo -->
<rect x="20" y="16" width="32" height="32" rx="6" fill="#666666" stroke="#CCCCCC"/>
<text x="62" y="38" font-size="18" font-weight="bold" fill="#333333">TimeTracker</text>
<line x1="0" y1="64" x2="260" y2="64" stroke="#CCCCCC"/>

<rect x="12" y="80" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="90" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="106" font-size="14" font-weight="normal" fill="#333333">Таймер</text>

<rect x="12" y="128" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="138" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="154" font-size="14" font-weight="normal" fill="#333333">Журнал времени</text>

<rect x="12" y="176" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="186" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="202" font-size="14" font-weight="normal" fill="#333333">Проекты и задачи</text>

<rect x="12" y="224" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="234" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="250" font-size="14" font-weight="normal" fill="#333333">Отчёты и экспорт</text>

<rect x="12" y="272" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="282" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="298" font-size="14" font-weight="normal" fill="#333333">Планы и лимиты</text>

<rect x="12" y="320" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="330" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="346" font-size="14" font-weight="normal" fill="#333333">Подключения</text>

<rect x="12" y="368" width="236" height="40" rx="8" fill="#E8E8E8"/>
<rect x="24" y="378" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="394" font-size="14" font-weight="bold" fill="#333333">Справка</text>
<line x1="12" y1="436" x2="248" y2="436" stroke="#CCCCCC"/>
<rect x="12" y="456" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="466" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="482" font-size="14" fill="#333333">Личный кабинет</text>

<rect x="12" y="832" width="236" height="52" rx="8" fill="transparent" stroke="#CCCCCC"/>
<circle cx="40" cy="858" r="16" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="64" y="852" font-size="13" font-weight="bold" fill="#333333">Иван Петров</text>
<text x="64" y="866" font-size="11" fill="#999999">ivan@example.com</text>

<rect x="260" y="0" width="1180" height="64" fill="#FAFAFA" stroke="#CCCCCC"/>
<text x="292" y="40" font-size="20" font-weight="bold" fill="#333333">Справка и политика данных</text>
<!-- Search in header -->
<rect x="1060" y="16" width="240" height="32" rx="6" fill="white" stroke="#CCCCCC"/>
<text x="1070" y="37" font-size="13" fill="#999999">Поиск...</text>
<!-- Notifications bell -->
<circle cx="1340" cy="32" r="16" fill="transparent" stroke="#CCCCCC"/>
<text x="1334" y="37" font-size="14" fill="#999999">🔔</text>
<!-- User avatar -->
<circle cx="1392" cy="32" r="16" fill="#E0E0E0" stroke="#CCCCCC"/>

<rect x="292" y="116" width="1116" height="44" rx="8" fill="#F5F5F5" stroke="#CCCCCC"/>
<rect x="296" y="120" width="80" height="36" rx="6" fill="white" stroke="#CCCCCC"/>
<text x="336" y="144" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">FAQ</text>
<text x="462" y="144" font-size="13" fill="#999999" text-anchor="middle">Руководство</text>
<text x="612" y="144" font-size="13" fill="#999999" text-anchor="middle">Политика данных</text>
<text x="762" y="144" font-size="13" fill="#999999" text-anchor="middle">Обратная связь</text>

<rect x="292" y="186" width="1116" height="44" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="214" font-size="14" fill="#999999">Поиск по справке...</text>

<rect x="292" y="250" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="274" font-size="14" font-weight="bold" fill="#333333">Как начать отслеживание времени?</text>
<text x="308" y="298" font-size="12" fill="#999999">Нажмите кнопку "Старт" на главном экране или используйте сочетание клавиш Ctrl+Shift+T...</text>
<text x="1384" y="286" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="330" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="354" font-size="14" font-weight="bold" fill="#333333">Как создать новый проект?</text>
<text x="308" y="378" font-size="12" fill="#999999">Перейдите в раздел "Проекты и задачи", нажмите "+ Новый проект"...</text>
<text x="1384" y="366" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="410" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="434" font-size="14" font-weight="bold" fill="#333333">Как экспортировать отчёт?</text>
<text x="308" y="458" font-size="12" fill="#999999">В разделе "Отчёты" выберите период и нажмите "Экспорт PDF" или "Экспорт CSV"...</text>
<text x="1384" y="446" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="490" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="514" font-size="14" font-weight="bold" fill="#333333">Как добавить комментарий к записи?</text>
<text x="308" y="538" font-size="12" fill="#999999">На карточке сессии нажмите иконку комментария и введите текст...</text>
<text x="1384" y="526" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="570" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="594" font-size="14" font-weight="bold" fill="#333333">Как настроить уведомления?</text>
<text x="308" y="618" font-size="12" fill="#999999">Перейдите в Личный кабинет → Уведомления и настройте параметры...</text>
<text x="1384" y="606" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="650" width="1116" height="72" rx="8" fill="white" stroke="#CCCCCC"/>
<text x="308" y="674" font-size="14" font-weight="bold" fill="#333333">Как синхронизировать устройства?</text>
<text x="308" y="698" font-size="12" fill="#999999">В разделе Синхронизация вы можете управлять подключёнными устройствами...</text>
<text x="1384" y="686" font-size="16" fill="#999999" text-anchor="end">▼</text>

<rect x="292" y="730" width="1116" height="60" rx="8" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="850" y="754" font-size="14" fill="#333333" text-anchor="middle">Не нашли ответ?</text>
<text x="850" y="776" font-size="14" fill="#666666" text-anchor="middle" font-weight="bold">Написать в поддержку →</text>
</svg>