<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: Inter, Arial, Helvetica, sans-serif; }
</style>
<rect width="1440" height="900" fill="#FFFFFF"/>
<rect x="0" y="0" width="260" height="900" fill="#F5F5F5" stroke="#CCCCCC"/>
<!-- Logo -->
<rect x="20" y="16" width="32" height="32" rx="6" fill="#666666" stroke="#CCCCCC"/>
<text x="62" y="38" font-size="18" font-weight="bold" fill="#333333">TimeTracker</text>
<line x1="0" y1="64" x2="260" y2="64" stroke="#CCCCCC"/>

<rect x="12" y="80" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="90" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="106" font-size="14" font-weight="normal" fill="#333333">Таймер</text>

<rect x="12" y="128" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="138" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="154" font-size="14" font-weight="normal" fill="#333333">Журнал времени</text>

<rect x="12" y="176" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="186" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="202" font-size="14" font-weight="normal" fill="#333333">Проекты и задачи</text>

<rect x="12" y="224" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="234" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="250" font-size="14" font-weight="normal" fill="#333333">Отчёты и экспорт</text>

<rect x="12" y="272" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="282" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="298" font-size="14" font-weight="normal" fill="#333333">Планы и лимиты</text>

<rect x="12" y="320" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="330" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="346" font-size="14" font-weight="normal" fill="#333333">Подключения</text>

<rect x="12" y="368" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="378" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="394" font-size="14" font-weight="normal" fill="#333333">Справка</text>
<line x1="12" y1="436" x2="248" y2="436" stroke="#CCCCCC"/>
<rect x="12" y="456" width="236" height="40" rx="8" fill="transparent"/>
<rect x="24" y="466" width="20" height="20" rx="4" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="52" y="482" font-size="14" fill="#333333">Личный кабинет</text>

<rect x="12" y="832" width="236" height="52" rx="8" fill="transparent" stroke="#CCCCCC"/>
<circle cx="40" cy="858" r="16" fill="#E0E0E0" stroke="#CCCCCC"/>
<text x="64" y="852" font-size="13" font-weight="bold" fill="#333333">Иван Петров</text>
<text x="64" y="866" font-size="11" fill="#999999">ivan@example.com</text>

<rect x="260" y="0" width="1180" height="64" fill="#FAFAFA" stroke="#CCCCCC"/>
<text x="292" y="40" font-size="20" font-weight="bold" fill="#333333">Горячие клавиши</text>
<!-- Search in header -->
<rect x="1060" y="16" width="240" height="32" rx="6" fill="white" stroke="#CCCCCC"/>
<text x="1070" y="37" font-size="13" fill="#999999">Поиск...</text>
<!-- Notifications bell -->
<circle cx="1340" cy="32" r="16" fill="transparent" stroke="#CCCCCC"/>
<text x="1334" y="37" font-size="14" fill="#999999">🔔</text>
<!-- User avatar -->
<circle cx="1392" cy="32" r="16" fill="#E0E0E0" stroke="#CCCCCC"/>

<rect x="292" y="116" width="1116" height="44" rx="8" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="356" y="144" font-size="13" fill="#999999" text-anchor="middle">Профиль</text>
<text x="492" y="144" font-size="13" fill="#999999" text-anchor="middle">Синхронизация</text>
<text x="652" y="144" font-size="13" fill="#999999" text-anchor="middle">Уведомления</text>
<rect x="722" y="120" width="150" height="36" rx="6" fill="white" stroke="#CCCCCC"/>
<text x="797" y="144" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Горячие клавиши</text>
<text x="292" y="186" font-size="16" font-weight="bold" fill="#333333">Сочетания клавиш</text>
<rect x="292" y="210" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="238" font-size="14" fill="#333333">Запуск/Остановка таймера</text>
<rect x="1228" y="218" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="238" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + Shift + T</text>
<line x1="292" y1="254" x2="1408" y2="254" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="258" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="286" font-size="14" fill="#333333">Новая запись</text>
<rect x="1228" y="266" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="286" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + N</text>
<line x1="292" y1="302" x2="1408" y2="302" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="306" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="334" font-size="14" fill="#333333">Поиск</text>
<rect x="1228" y="314" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="334" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + K</text>
<line x1="292" y1="350" x2="1408" y2="350" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="354" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="382" font-size="14" fill="#333333">Переход к журналу</text>
<rect x="1228" y="362" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="382" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + J</text>
<line x1="292" y1="398" x2="1408" y2="398" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="402" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="430" font-size="14" fill="#333333">Переход к проектам</text>
<rect x="1228" y="410" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="430" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + P</text>
<line x1="292" y1="446" x2="1408" y2="446" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="450" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="478" font-size="14" fill="#333333">Переход к отчётам</text>
<rect x="1228" y="458" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="478" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + R</text>
<line x1="292" y1="494" x2="1408" y2="494" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="498" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="526" font-size="14" fill="#333333">Сохранить</text>
<rect x="1228" y="506" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="526" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + S</text>
<line x1="292" y1="542" x2="1408" y2="542" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="546" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="574" font-size="14" fill="#333333">Отменить последнее действие</text>
<rect x="1228" y="554" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="574" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + Z</text>
<line x1="292" y1="590" x2="1408" y2="590" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="594" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="622" font-size="14" fill="#333333">Быстрое переключение проекта</text>
<rect x="1228" y="602" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="622" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + Shift + P</text>
<line x1="292" y1="638" x2="1408" y2="638" stroke="#CCCCCC" stroke-opacity="0.3"/>

<rect x="292" y="642" width="1116" height="44" rx="0" fill="transparent"/>
<text x="292" y="670" font-size="14" fill="#333333">Открыть настройки</text>
<rect x="1228" y="650" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#CCCCCC"/>
<text x="1308" y="670" font-size="13" fill="#666666" text-anchor="middle" font-family="monospace">Ctrl + ,</text>
<line x1="292" y1="686" x2="1408" y2="686" stroke="#CCCCCC" stroke-opacity="0.3"/>
</svg>