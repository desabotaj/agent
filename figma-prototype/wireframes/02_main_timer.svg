<rect x="292" y="578" width="1116" height="56" rx="8" fill="white" stroke="#CCCCCC"/>
<rect x="300" y="586" width="4" height="40" rx="2" fill="#666666"/>
<text x="316" y="602" font-size="14" font-weight="bold" fill="#333333">Написание документации</text>
<text x="316" y="620" font-size="12" fill="#999999">Проект: API v2</text>
<text x="1392" y="602" font-size="14" font-weight="bold" fill="#333333" text-anchor="end">0:53:23</text>
