<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">08  /  ТИПОГРАФИКА</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Три голоса одной шрифтовой системы</text>
    <rect x="72" y="230" width="1296" height="170" rx="18" fill="#242422" stroke="none" stroke-width="1"/>
    <text x="102" y="270" class="kicker" fill="#B65E43" text-anchor="start">ЛОГОТИП И АКЦЕНТ</text>
    <text x="102" y="351" class="decor" fill="#FFFFFF" font-size="66px">ПРОСТРАНСТВО</text>
    <text x="1090" y="351" class="label" fill="#DDE4D8" text-anchor="start">DECOR / 48+</text>
    <rect x="72" y="424" width="1296" height="200" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="102" y="466" class="kicker" fill="#B65E43" text-anchor="start">ЗАГОЛОВКИ И ИСТОРИИ</text>
    <text x="102" y="548" class="serif" fill="#242422" font-size="52px">Комната начинается с ощущения</text>
    <text x="1090" y="548" class="label" fill="#71816D" text-anchor="start">SERIF / 24+</text>
    <rect x="72" y="648" width="1296" height="225" rx="18" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <text x="102" y="690" class="kicker" fill="#B65E43" text-anchor="start">ИНТЕРФЕЙС И ОСНОВНОЙ ТЕКСТ</text>
    <text x="102" y="760" class="sans" fill="#242422" font-size="30px">Начните с замеров комнаты и добавьте основные зоны.</text>
    <text x="102" y="811" class="sans" fill="#242422" font-size="20px">Prostranstvo Sans Regular · основной текст 16/24 · подписи 14/20 · кнопки 14/18</text>
    <text x="1090" y="811" class="label" fill="#71816D" text-anchor="start">SANS / 14+</text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">09</text>
    
</svg>
