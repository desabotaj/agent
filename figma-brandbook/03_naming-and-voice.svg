<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">03  /  НЕЙМИНГ И ГОЛОС</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="190" class="decor" fill="#242422" font-size="80px">ПРОСТРАНСТВО</text>
    <text x="76" y="238" class="body" fill="#71816D" text-anchor="start">[про-стра́н-ство]  •  существительное, средний род</text>
    <rect x="72" y="298" width="630" height="265" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="102" y="341" class="kicker" fill="#B65E43" text-anchor="start">ЗНАЧЕНИЕ</text>
    <text x="102" y="390" class="body" fill="#242422"><tspan x="102" dy="0">Название говорит и о физическом месте,</tspan><tspan x="102" dy="32">которое пользователь проектирует, и о</tspan><tspan x="102" dy="32">свободе для собственных решений.</tspan></text>
    <rect x="734" y="298" width="634" height="265" rx="18" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <text x="764" y="341" class="kicker" fill="#B65E43" text-anchor="start">ПРАВИЛА НАПИСАНИЯ</text>
    <text x="764" y="390" class="body" fill="#242422"><tspan x="764" dy="0">Логотип: ПРОСТРАНСТВО</tspan><tspan x="764" dy="32">В тексте: приложение «Пространство»</tspan><tspan x="764" dy="32">Форма: в «Пространстве», из «Пространства»</tspan><tspan x="764" dy="32">Не использовать: Prostranstvo / ПРОСТРАНСТВА</tspan></text>
    <text x="72" y="648" class="kicker" fill="#B65E43" text-anchor="start">СЛОГАН</text>
    <text x="72" y="716" class="h2" fill="#242422" text-anchor="start">ОТ ИДЕИ — К СВОЕМУ ПРОСТРАНСТВУ</text>
    <text x="72" y="786" class="kicker" fill="#B65E43" text-anchor="start">ГОЛОС БРЕНДА</text>
    <rect x="72" y="820" width="154" height="38" rx="19" fill="#71816D" stroke="none" stroke-width="1"/><text x="149" y="845" class="label" fill="#FFFFFF" text-anchor="middle">ПОДДЕРЖИВАЕМ</text>
    <rect x="258" y="820" width="124" height="38" rx="19" fill="#71816D" stroke="none" stroke-width="1"/><text x="320" y="845" class="label" fill="#FFFFFF" text-anchor="middle">ОБЪЯСНЯЕМ</text>
    <rect x="429" y="820" width="134" height="38" rx="19" fill="#B65E43" stroke="none" stroke-width="1"/><text x="496" y="845" class="label" fill="#FFFFFF" text-anchor="middle">НЕ ПОУЧАЕМ</text>
    <rect x="608" y="820" width="174" height="38" rx="19" fill="#B65E43" stroke="none" stroke-width="1"/><text x="695" y="845" class="label" fill="#FFFFFF" text-anchor="middle">ГОВОРИМ ПРОСТО</text>
    <text x="72" y="910" class="body" fill="#242422" text-anchor="start">«Начните с главного: как вы хотите чувствовать себя в этой комнате?»</text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">04</text>
    
</svg>
