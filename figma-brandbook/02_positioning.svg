<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">02  /  ПОЗИЦИОНИРОВАНИЕ</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Не рисовать за человека — научить его видеть</text>
    <rect x="72" y="250" width="606" height="260" rx="22" fill="#242422" stroke="none" stroke-width="1"/>
    <text x="106" y="298" class="kicker" fill="#B65E43" text-anchor="start">МИССИЯ</text>
    <text x="106" y="350" class="h2" fill="#FFFFFF"><tspan x="106" dy="0">Сделать базовые принципы</tspan><tspan x="106" dy="43">интерьерного дизайна понятными</tspan><tspan x="106" dy="43">и применимыми в реальной комнате.</tspan></text>
    <rect x="710" y="250" width="658" height="260" rx="22" fill="#71816D" stroke="none" stroke-width="1"/>
    <text x="744" y="298" class="kicker" fill="#FFFFFF" text-anchor="start">ОБЕЩАНИЕ БРЕНДА</text>
    <text x="744" y="350" class="h2" fill="#FFFFFF"><tspan x="744" dy="0">От пустой комнаты</tspan><tspan x="744" dy="43">к уверенному проекту —</tspan><tspan x="744" dy="43">шаг за шагом.</tspan></text>
    <text x="72" y="590" class="kicker" fill="#B65E43" text-anchor="start">ЦЕННОСТИ</text>
    <text x="72" y="687" class="num" fill="#242422" text-anchor="start">ЯСНОСТЬ</text>
    <text x="499" y="687" class="num" fill="#242422" text-anchor="start">ТЕПЛО</text>
    <text x="878" y="687" class="num" fill="#242422" text-anchor="start">СМЕЛОСТЬ</text>
    <text x="76" y="740" class="small" fill="#71816D"><tspan x="76" dy="0">Простые действия,</tspan><tspan x="76" dy="24">понятный результат.</tspan></text>
    <text x="503" y="740" class="small" fill="#71816D"><tspan x="503" dy="0">Дом — живое место,</tspan><tspan x="503" dy="24">а не холодный макет.</tspan></text>
    <text x="882" y="740" class="small" fill="#71816D"><tspan x="882" dy="0">Можно пробовать,</tspan><tspan x="882" dy="24">ошибаться и менять.</tspan></text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">03</text>
    
</svg>
