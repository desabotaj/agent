  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">07  /  ФИРМЕННЫЕ ЦВЕТА</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Тепло материала и спокойствие жилого пространства</text>
    <text x="76" y="216" class="body" fill="#71816D" text-anchor="start">Основные: терракота, шалфейный, кремовый и графитовый. Светлые оттенки — только для фонов.</text>
