<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">10  /  ПРИМЕР: МОБИЛЬНОЕ ПРИЛОЖЕНИЕ</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Фирменный стиль помогает пройти первый шаг</text>
    <rect x="72" y="230" width="1296" height="650" rx="28" fill="#D8D0C6" stroke="none" stroke-width="1"/>
    <rect x="177" y="265" width="350" height="580" rx="34" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="211" y="311" class="label" fill="#B65E43" text-anchor="start">ПРОСТРАНСТВО</text>
    <text x="211" y="371" class="h2" fill="#242422" text-anchor="start">С чего начнём?</text>
    <rect x="211" y="412" width="282" height="146" rx="16" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <path d="M237 528 L237 446 L333 446" fill="none" stroke="#B65E43" stroke-width="11"/>
    <circle cx="291" cy="488" r="25" fill="#71816D"/>
    <text x="211" y="604" class="label" fill="#242422" text-anchor="start">Моя гостиная</text>
    <text x="211" y="635" class="small" fill="#71816D" text-anchor="start">0 из 6 шагов</text>
    <rect x="211" y="694" width="282" height="48" rx="12" fill="#242422" stroke="none" stroke-width="1"/>
    <text x="352" y="725" class="label" fill="#FFFFFF" text-anchor="middle">ПРОДОЛЖИТЬ</text>
    <rect x="597" y="265" width="350" height="580" rx="34" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="631" y="311" class="label" fill="#B65E43" text-anchor="start">ШАГ 1 ИЗ 6</text>
    <text x="631" y="371" class="h2" fill="#242422" text-anchor="start">Как вы живёте</text>
    <text x="631" y="405" class="h2" fill="#242422" text-anchor="start">в этой комнате?</text>
    <rect x="631" y="449" width="282" height="66" rx="13" fill="#F4F0E8" stroke="#E7C3B7" stroke-width="2"/>
    <text x="655" y="490" class="body" fill="#242422" text-anchor="start">Отдыхаю и читаю</text>
    <rect x="631" y="532" width="282" height="66" rx="13" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <text x="655" y="573" class="body" fill="#242422" text-anchor="start">Встречаю гостей</text>
    <rect x="631" y="615" width="282" height="66" rx="13" fill="#F4F0E8" stroke="#E7C3B7" stroke-width="2"/>
    <text x="655" y="656" class="body" fill="#242422" text-anchor="start">Иногда работаю</text>
    <rect x="631" y="720" width="282" height="48" rx="12" fill="#B65E43" stroke="none" stroke-width="1"/>
    <text x="772" y="751" class="label" fill="#FFFFFF" text-anchor="middle">ДАЛЬШЕ</text>
    <rect x="1017" y="265" width="246" height="580" rx="34" fill="#242422" stroke="none" stroke-width="1"/>
    
    <g transform="translate(1054 329) scale(0.9)">
      <path d="M0 170 L0 0 L170 0" fill="none" stroke="#FFFFFF" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="88" r="37" fill="#DDE4D8"/>
    </g>
    <text x="1054" y="593" class="h2" fill="#FFFFFF"><tspan x="1054" dy="0">От идеи —</tspan><tspan x="1054" dy="46">к своему</tspan><tspan x="1054" dy="46">пространству</tspan></text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">11</text>
    
</svg>
