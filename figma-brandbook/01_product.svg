<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">01  /  ПРОДУКТ</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Карманная студия для первого интерьера</text>
    <text x="76" y="221" class="body" fill="#242422"><tspan x="76" dy="0">«Пространство» помогает начинающему дизайнеру пройти путь от пустой комнаты</tspan><tspan x="76" dy="31">до понятного проекта — без сложных профессиональных программ и лишней теории.</tspan></text>
    <rect x="76" y="316" width="124" height="38" rx="19" fill="#B65E43" stroke="none" stroke-width="1"/><text x="138" y="341" class="label" fill="#FFFFFF" text-anchor="middle">18–35 ЛЕТ</text>
    <rect x="230" y="316" width="118" height="38" rx="19" fill="#71816D" stroke="none" stroke-width="1"/><text x="289" y="341" class="label" fill="#FFFFFF" text-anchor="middle">НОВИЧКИ</text>
    <rect x="374" y="316" width="118" height="38" rx="19" fill="#71816D" stroke="none" stroke-width="1"/><text x="433" y="341" class="label" fill="#FFFFFF" text-anchor="middle">СТУДЕНТЫ</text>
    <rect x="530" y="316" width="184" height="38" rx="19" fill="#B65E43" stroke="none" stroke-width="1"/><text x="622" y="341" class="label" fill="#FFFFFF" text-anchor="middle">ВЛАДЕЛЬЦЫ ЖИЛЬЯ</text>
    <rect x="72" y="430" width="608" height="175" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="100" y="478" class="kicker" fill="#B65E43" text-anchor="start">01</text><text x="168" y="478" class="label" fill="#242422" text-anchor="start">ПОШАГОВЫЙ ПРОЕКТ</text><text x="168" y="518" class="body" fill="#71816D"><tspan x="168" dy="0">Сценарий от замера комнаты до готовой концепции.</tspan></text><rect x="716" y="430" width="608" height="175" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="744" y="478" class="kicker" fill="#B65E43" text-anchor="start">02</text><text x="812" y="478" class="label" fill="#242422" text-anchor="start">ПЛАНИРОВКА</text><text x="812" y="518" class="body" fill="#71816D"><tspan x="812" dy="0">Зоны, мебель, размеры и проверка удобства проходов.</tspan></text><rect x="72" y="645" width="608" height="175" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="100" y="693" class="kicker" fill="#B65E43" text-anchor="start">03</text><text x="168" y="693" class="label" fill="#242422" text-anchor="start">МАТЕРИАЛЫ</text><text x="168" y="733" class="body" fill="#71816D"><tspan x="168" dy="0">Палитры, фактуры и доски настроения в одном месте.</tspan></text><rect x="716" y="645" width="608" height="175" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="744" y="693" class="kicker" fill="#B65E43" text-anchor="start">04</text><text x="812" y="693" class="label" fill="#242422" text-anchor="start">ОБУЧЕНИЕ</text><text x="812" y="733" class="body" fill="#71816D"><tspan x="812" dy="0">Короткие уроки, подсказки и чек-листы для новичка.</tspan></text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">02</text>
    
</svg>
