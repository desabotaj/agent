<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">04  /  ЛОГОТИП</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Комната, стол и пространство для идеи</text>
    <rect x="72" y="240" width="1296" height="310" rx="22" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    
    <g transform="translate(125 296) scale(1.05)">
      <path d="M0 170 L0 0 L170 0" fill="none" stroke="#B65E43" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="88" r="37" fill="#71816D"/>
    </g>
    <text x="383" y="385" class="decor" fill="#242422" font-size="76px">ПРОСТРАНСТВО</text>
    <text x="391" y="438" class="label" fill="#71816D" text-anchor="start">ДИЗАЙН ИНТЕРЬЕРА С НУЛЯ</text>
    <line x1="391" y1="469" x2="1167" y2="469" stroke="#B65E43" stroke-width="4"/>
    <text x="72" y="625" class="kicker" fill="#B65E43" text-anchor="start">СОСТАВ</text>
    <rect x="72" y="662" width="392" height="190" rx="18" fill="#E7C3B7" stroke="none" stroke-width="1"/>
    
    <g transform="translate(110 696) scale(0.72)">
      <path d="M0 170 L0 0 L170 0" fill="none" stroke="#B65E43" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="88" r="37" fill="#71816D"/>
    </g>
    <text x="265" y="729" class="label" fill="#242422" text-anchor="start">ОТКРЫТЫЙ УГОЛ</text>
    <text x="265" y="766" class="small" fill="#71816D"><tspan x="265" dy="0">план комнаты</tspan><tspan x="265" dy="24">и свобода решения</tspan></text>
    <rect x="488" y="662" width="392" height="190" rx="18" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <circle cx="581" cy="757" r="45" fill="#71816D"/>
    <text x="666" y="729" class="label" fill="#242422" text-anchor="start">КРУГ</text>
    <text x="666" y="766" class="small" fill="#71816D"><tspan x="666" dy="0">стол, общение</tspan><tspan x="666" dy="24">и центр дома</tspan></text>
    <rect x="904" y="662" width="464" height="190" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="934" y="753" class="decor" fill="#242422" font-size="38px">ПРОСТРАНСТВО</text>
    <text x="934" y="804" class="small" fill="#71816D" text-anchor="start">авторские декоративные буквы</text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">05</text>
    
</svg>
