<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">

  <style>
    @font-face{font-family:'Prostranstvo Sans';src:url('../dist/ProstranstvoSans-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Serif';src:url('../dist/ProstranstvoSerif-Regular.ttf')}
    @font-face{font-family:'Prostranstvo Decor';src:url('../dist/ProstranstvoDecor-Regular.ttf')}
    .sans{font-family:'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .serif{font-family:'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .decor{font-family:'Prostranstvo Decor','Prostranstvo Serif',Georgia,serif}
    .kicker{font:700 14px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2.2px}
    .title{font:400 48px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .h2{font:400 30px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
    .body{font:400 18px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .small{font:400 14px 'Prostranstvo Sans','DejaVu Sans',Arial,sans-serif}
    .label{font:700 13px 'DejaVu Sans',Arial,sans-serif;letter-spacing:1.2px}
    .num{font:400 92px 'Prostranstvo Serif','DejaVu Serif',Georgia,serif}
  </style>

  <rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F4F0E8" stroke="none" stroke-width="1"/>
  
    <text x="72" y="58" class="kicker" fill="#B65E43" text-anchor="start">09  /  СТИЛЕОБРАЗУЮЩИЕ ЭЛЕМЕНТЫ</text><line x1="72" y1="78" x2="1368" y2="78" stroke="#E7C3B7" stroke-width="2"/>
    <text x="72" y="163" class="title" fill="#242422" text-anchor="start">Геометрия, которую можно собрать руками</text>
    <rect x="72" y="242" width="400" height="300" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/>
    <text x="102" y="282" class="kicker" fill="#B65E43" text-anchor="start">УГОЛ ПЛАНА</text>
    <path d="M128 472 L128 342 L312 342" fill="none" stroke="#B65E43" stroke-width="22" stroke-linecap="round"/>
    <rect x="504" y="242" width="400" height="300" rx="18" fill="#DDE4D8" stroke="none" stroke-width="1"/>
    <text x="534" y="282" class="kicker" fill="#B65E43" text-anchor="start">КРУГЛЫЙ СТОЛ</text>
    <circle cx="704" cy="402" r="82" fill="#71816D"/>
    <rect x="936" y="242" width="432" height="300" rx="18" fill="#E7C3B7" stroke="none" stroke-width="1"/>
    <text x="966" y="282" class="kicker" fill="#B65E43" text-anchor="start">ПЛИТКА И ФАКТУРА</text>
    <path d="M1040 404 L1110 334 L1180 404 L1110 474 Z" fill="#B65E43"/>
    <path d="M1168 404 L1229 343 L1290 404 L1229 465 Z" fill="#71816D"/>
    <text x="72" y="620" class="kicker" fill="#B65E43" text-anchor="start">ПРАВИЛО КОМПОЗИЦИИ</text>
    <rect x="72" y="658" width="1296" height="208" rx="18" fill="#242422" stroke="none" stroke-width="1"/>
    
    <g transform="translate(112 695) scale(0.72)">
      <path d="M0 170 L0 0 L170 0" fill="none" stroke="#FFFFFF" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="88" r="37" fill="#DDE4D8"/>
    </g>
    <text x="292" y="716" class="body" fill="#FFFFFF"><tspan x="292" dy="0">Используйте один крупный элемент и один малый акцент.</tspan><tspan x="292" dy="42">Не выравнивайте декоративные детали идеально: допустим сдвиг 2–4 px.</tspan><tspan x="292" dy="42">Форма должна поддерживать содержание, а не спорить с текстом.</tspan></text>
    <text x="72" y="982" class="label" fill="#71816D" text-anchor="start">ПРОСТРАНСТВО  •  БРЕНДБУК</text><text x="1368" y="982" class="label" fill="#71816D" text-anchor="end">10</text>
    
</svg>
